<!DOCTYPE HTML>
<html>
<head>
	<title>Wedding Game - Claudia & Marco</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link rel="stylesheet" href="assets/css/main.css" />
	<style>
		body {
			background: #2e3842;
			color: #fff;
			font-family: "Open Sans", Helvetica, sans-serif;
		}

		.game-container {
			max-width: 800px;
			margin: 2em auto;
			padding: 2em;
			text-align: center;
		}

		.game-header {
			margin-bottom: 2em;
		}

		.game-header h1 {
			font-size: 2.5em;
			margin: 0 0 0.5em 0;
			color: #fff;
		}

		.game-header p {
			font-size: 1.1em;
			color: #21b2a6;
			margin: 0;
		}

		#gameCanvas {
			border: 3px solid #21b2a6;
			background: linear-gradient(180deg, #87ceeb 0%, #e0f6ff 100%);
			display: block;
			margin: 2em auto;
			cursor: crosshair;
			box-shadow: 0 0 20px rgba(33, 178, 166, 0.3);
		}

		.game-info {
			display: flex;
			justify-content: space-around;
			margin: 1.5em 0;
			flex-wrap: wrap;
			gap: 1em;
		}

		.stat {
			background: rgba(33, 178, 166, 0.1);
			padding: 1em 2em;
			border-radius: 5px;
			border: 1px solid #21b2a6;
		}

		.stat-label {
			font-size: 0.9em;
			color: #21b2a6;
			text-transform: uppercase;
		}

		.stat-value {
			font-size: 2em;
			font-weight: bold;
			color: #fff;
		}

		.controls {
			background: rgba(0, 0, 0, 0.2);
			padding: 1.5em;
			border-radius: 5px;
			margin: 2em 0;
		}

		.controls p {
			margin: 0.5em 0;
			font-size: 1em;
		}

		.button-group {
			margin: 1.5em 0 0 0;
		}

		.game-button {
			background-color: #ed4933;
			color: white;
			border: none;
			padding: 1em 2em;
			font-size: 1em;
			border-radius: 5px;
			cursor: pointer;
			margin: 0.5em;
			transition: background-color 0.3s;
		}

		.game-button:hover {
			background-color: #ef5e4a;
		}

		.game-button:active {
			background-color: #eb341c;
		}

		.back-button {
			display: inline-block;
			margin-top: 1em;
			color: #21b2a6;
			text-decoration: none;
			border: 1px solid #21b2a6;
			padding: 0.5em 1.5em;
			border-radius: 3px;
			transition: all 0.3s;
		}

		.back-button:hover {
			background-color: #21b2a6;
			color: #fff;
		}

		.game-over {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			background: rgba(0, 0, 0, 0.9);
			padding: 3em;
			border-radius: 10px;
			text-align: center;
			z-index: 1000;
			display: none;
			min-width: 300px;
			border: 3px solid #21b2a6;
		}

		.game-over h2 {
			font-size: 2.5em;
			margin: 0 0 0.5em 0;
			color: #21b2a6;
		}

		.game-over p {
			font-size: 1.2em;
			margin: 0.5em 0;
		}

		.game-over .score {
			font-size: 2em;
			color: #ed4933;
			font-weight: bold;
			margin: 1em 0;
		}

		@media (max-width: 600px) {
			.game-container {
				padding: 1em;
			}

			#gameCanvas {
				max-width: 100%;
				height: auto;
			}

			.game-header h1 {
				font-size: 1.8em;
			}

			.game-info {
				flex-direction: column;
			}
		}
	</style>
</head>

<body class="landing">
	<div id="page-wrapper">
		<section class="wrapper style1 special">
			<div class="inner">
				<div class="game-container">
					<div class="game-header">
						<h1>💕 Marco's Quest 💕</h1>
						<p>Help Marco reach Claudia at the altar!</p>
					</div>

					<canvas id="gameCanvas" width="760" height="400"></canvas>

					<div class="game-info">
						<div class="stat">
							<div class="stat-label">Score</div>
							<div class="stat-value" id="score">0</div>
						</div>
						<div class="stat">
							<div class="stat-label">Best Score</div>
							<div class="stat-value" id="bestScore">0</div>
						</div>
						<div class="stat">
							<div class="stat-label">Lives</div>
							<div class="stat-value" id="lives">3</div>
						</div>
					</div>

					<div class="controls">
						<p><strong>📱 Click or Tap</strong> to make Marco jump</p>
						<p><strong>⌨️ Spacebar</strong> also works</p>
						<p>💕 Collect hearts for points • 🌸 Avoid obstacles • 💒 Reach the altar!</p>
						<div class="button-group">
							<button class="game-button" id="restartBtn">Restart Game</button>
							<button class="game-button" id="pauseBtn">Pause</button>
						</div>
					</div>

					<a href="index.html" class="back-button">← Back to Wedding</a>
				</div>
			</div>
		</section>
	</div>

	<div class="game-over" id="gameOverScreen">
		<h2 id="gameOverTitle">Game Over!</h2>
		<p id="gameOverMessage">You reached the altar!</p>
		<div class="score" id="gameOverScore">Score: 0</div>
		<button class="game-button" onclick="location.reload()">Play Again</button>
		<button class="game-button" onclick="window.location.href='index.html'">Back to Wedding</button>
	</div>

	<script src="assets/js/game.js"></script>
</body>
</html>
